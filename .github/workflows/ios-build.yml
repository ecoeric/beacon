name: iOS build, tests & SideStore release
# Indexing trigger: this workflow must be registered on the default branch.

# Beacon is developed on Linux with no Xcode. This workflow does the real iOS-SDK work on a
# GitHub-hosted macOS 26 runner:
#
#   * simulator tests
#   * an unsigned arm64 device build packaged as Payload/Beacon.app in a .ipa
#   * a gated publish job that creates a immutable GitHub Release and updates the stable
#     SideStore source feed (apps.json + icon) after BOTH jobs above succeed
#
# The IPA is intentionally UNSIGNED. It contains the app and its bundled private CA, but no
# Apple provisioning profile. SideStore signs it on-device with the user's Apple ID; see
# docs/OTA.md. The old USB/AltServer path remains as a fallback (docs/LINUX_IPA_INSTALL.md).

on:
  push:
    branches:
      - master
      - main
    paths:
      - "ios/**"
      - "scripts/gen_xcodeproj.py"
      - "scripts/validate_ios_project.py"
      - "scripts/ota_source.py"
      - "scripts/make_app_icon.py"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "scripts/gen_xcodeproj.py"
      - "scripts/validate_ios_project.py"
      - "scripts/ota_source.py"
      - "scripts/make_app_icon.py"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  # Never cancel an in-flight release publish. Pull-request builds may be superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: ios/Beacon.xcodeproj
  SCHEME: Beacon
  XCODE_APP: /Applications/Xcode_26.2.app
  XCODE_VERSION: "26.2"
  # Every successful run gets a monotonically increasing marketing version. SideStore compares
  # CFBundleShortVersionString, so a hardcoded 1.0 would never produce an update prompt.
  APP_VERSION: 1.0.${{ github.run_number }}
  APP_BUILD: ${{ github.run_number }}

jobs:
  unsigned-ipa:
    name: Unsigned IPA (device, arm64)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify the committed Xcode project matches the generator
        run: |
          python3 scripts/gen_xcodeproj.py
          git diff --exit-code -- ios/Beacon.xcodeproj

      - name: Select Xcode 26.2 and verify the iOS SDK
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "Xcode 26.2 is not installed at $XCODE_APP" >&2
            echo "Available Xcode installations:" >&2
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS device SDK: $SDK_VERSION"
          case "$SDK_VERSION" in
            26.*) ;;
            *) echo "Expected an iOS 26 SDK, got $SDK_VERSION" >&2; exit 1 ;;
          esac
          xcodebuild -list -project "$PROJECT"

      - name: Build unsigned arm64 app for the device
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            VALIDATE_PRODUCT=NO \
            clean build 2>&1 | tee build.log

      - name: Package and verify the unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/DerivedData/Build/Products/Release-iphoneos/Beacon.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="$(find "$PWD/build/DerivedData/Build/Products" -maxdepth 2 -name Beacon.app -type d | head -n 1)"
          fi
          if [ -z "${APP_PATH:-}" ] || [ ! -d "$APP_PATH" ]; then
            echo "Beacon.app was not produced" >&2
            find "$PWD/build" -maxdepth 5 -type d -name '*.app' -print >&2 || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" | tee build-info.txt

          test -f "$APP_PATH/Info.plist"
          if [ ! -f "$APP_PATH/ca.crt" ]; then
            echo "The bundled CA is missing from $APP_PATH" >&2
            exit 1
          fi
          test -f "$APP_PATH/Beacon"
          file "$APP_PATH/Beacon" | tee -a build-info.txt
          lipo -info "$APP_PATH/Beacon" | tee -a build-info.txt

          # The build must not be signed: Xcode's signing flags above are deliberately off.
          if codesign -dv "$APP_PATH" >/dev/null 2>&1; then
            echo "WARNING: Xcode produced a signed app; inspecting it" | tee -a build-info.txt
            codesign -dv "$APP_PATH" 2>&1 | tee -a build-info.txt || true
          else
            echo "codesign: app is unsigned (expected)" | tee -a build-info.txt
          fi

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry Beacon-unsigned.ipa Payload)
          mv build/Beacon-unsigned.ipa .

          unzip -l Beacon-unsigned.ipa | grep -q 'Payload/Beacon.app/Beacon'
          unzip -l Beacon-unsigned.ipa | grep -q 'Payload/Beacon.app/ca.crt'

          {
            echo "git_sha=$(git rev-parse HEAD)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "ios_sdk=$(xcrun --sdk iphoneos --show-sdk-version)"
            echo "bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
            echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" 2>/dev/null || echo unknown)"
            echo "build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist" 2>/dev/null || echo unknown)"
            echo "minimum_os=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist" 2>/dev/null || echo unknown)"
            echo "signed=false"
          } | tee -a build-info.txt

          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          if [ "$ACTUAL_VERSION" != "$APP_VERSION" ] || [ "$ACTUAL_BUILD" != "$APP_BUILD" ]; then
            echo "Version substitution failed: expected $APP_VERSION ($APP_BUILD), got $ACTUAL_VERSION ($ACTUAL_BUILD)" >&2
            echo "Is Info.plist still using \$(MARKETING_VERSION) / \$(CURRENT_PROJECT_VERSION)?" >&2
            exit 1
          fi

          shasum -a 256 Beacon-unsigned.ipa | tee Beacon-unsigned.ipa.sha256
          ls -lh Beacon-unsigned.ipa

      - name: Upload IPA, checksum and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beacon-unsigned-ipa
          path: |
            Beacon-unsigned.ipa
            Beacon-unsigned.ipa.sha256
            build-info.txt
            build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Summarise IPA result
        if: always()
        run: |
          {
            echo "### Unsigned Beacon IPA"
            echo ""
            echo "- Runner: \`macos-26\`"
            echo "- Xcode: $(xcodebuild -version | head -1)"
            echo "- Result: ${{ job.status }}"
            echo "- Artifact: \`Beacon-unsigned-ipa\`"
            echo ""
            echo "The IPA is unsigned. Do not attempt to install it directly; sign it first (docs/LINUX_IPA_INSTALL.md)."
            echo ""
            echo "If this job failed, download the artifact and read \`build.log\`."
          } >> "$GITHUB_STEP_SUMMARY"

  simulator-tests:
    name: Simulator tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "Xcode 26.2 is not installed at $XCODE_APP" >&2
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          # Use the simulator UDID, not a name plus implicit "latest" OS. The runner has
          # iPhone 16e only on iOS 26.2; name=iPhone 16e,OS=latest resolves to a newer runtime
          # where that model does not exist.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess
          import sys

          data = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          )
          candidates = []
          for runtime, devices in data["devices"].items():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((device["name"], device["udid"], runtime))
          if not candidates:
              raise SystemExit("No iPhone simulator available")
          name, udid, runtime = next(
              (item for item in candidates if item[0] == "iPhone 16e"), candidates[0]
          )
          print(f"name={name}")
          print(f"udid={udid}")
          print(f"Using {name} ({runtime}, {udid})", file=sys.stderr)
          PY

      - name: Run unit and layout-snapshot tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee test.log

      - name: Upload test logs and xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beacon-simulator-tests
          path: |
            test.log
            TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Summarise test result
        if: always()
        run: |
          {
            echo "### Simulator tests"
            echo ""
            echo "- Simulator: ${{ steps.sim.outputs.name }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # SideStore / AltStore OTA publish
  #
  # This job only runs after BOTH the device build and simulator tests succeed, and only on the
  # repository's default branch. It never deletes an older release. If any step here fails, the
  # previously published source feed still points at the last working IPA.
  # ---------------------------------------------------------------------------------------------
  publish:
    name: Publish SideStore release
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [unsigned-ipa, simulator-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      APP_BUILD: ${{ github.run_number }}
      TAG: v1.0.${{ github.run_number }}
      TARGET_REPO: ${{ vars.BEACON_RELEASE_REPO || github.repository }}
      SOURCE_RELEASE_TAG: beacon-source
      # A fine-grained PAT with contents:write on the public release mirror. When unset, the
      # workflow uses GITHUB_TOKEN and the target repository must be public.
      GH_TOKEN: ${{ secrets.BEACON_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      HAS_RELEASE_TOKEN: ${{ secrets.BEACON_RELEASE_TOKEN != '' }}
    steps:
      - name: Check out source history for release notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download the tested IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Beacon-unsigned-ipa
          path: dist

      - name: Verify target repository is public and writable
        run: |
          set -euo pipefail
          if [ "$TARGET_REPO" != "$GITHUB_REPOSITORY" ] && [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            echo "::error::BEACON_RELEASE_REPO is set to $TARGET_REPO but BEACON_RELEASE_TOKEN is missing."
            echo "Add a fine-grained PAT with contents:write on that public repository as a secret."
            exit 1
          fi
          VISIBILITY="$(gh repo view "$TARGET_REPO" --json visibility -q .visibility)"
          if [ "$VISIBILITY" != "PUBLIC" ]; then
            echo "::error::Release target $TARGET_REPO is $VISIBILITY. SideStore cannot fetch private GitHub assets."
            echo "Make the repository public, or create a public release-only mirror and set the"
            echo "BEACON_RELEASE_REPO Actions variable plus the BEACON_RELEASE_TOKEN secret."
            exit 1
          fi

      - name: Verify IPA and prepare release metadata
        run: |
          set -euo pipefail
          mkdir -p ota
          (cd dist && sha256sum -c Beacon-unsigned.ipa.sha256)
          test -f dist/Beacon-unsigned.ipa
          test -f dist/build-info.txt
          grep -q 'arm64' dist/build-info.txt
          grep -q 'signed=false' dist/build-info.txt

          SOURCE_URL="https://github.com/${TARGET_REPO}/releases/download/${SOURCE_RELEASE_TAG}/apps.json"
          DOWNLOAD_URL="https://github.com/${TARGET_REPO}/releases/download/${TAG}/Beacon-unsigned.ipa"
          ICON_URL="https://github.com/${TARGET_REPO}/releases/download/${SOURCE_RELEASE_TAG}/Beacon-AppIcon.png"
          printf 'SOURCE_URL=%s\nDOWNLOAD_URL=%s\nICON_URL=%s\n' "$SOURCE_URL" "$DOWNLOAD_URL" "$ICON_URL" > ota/urls.env

          PREV_TAG="$(git tag --list 'v1.0.*' --sort=-version:refname | grep -v -F -x "$TAG" | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_SHA}"
          else
            RANGE="-20"
          fi
          {
            echo "## Beacon ${APP_VERSION}"
            echo
            echo "Built from \`${GITHUB_SHA}\` on $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "### Changes"
            echo
            git log --no-merges --pretty='- %s (%h)' "$RANGE" | head -n 40 || true
            echo
            echo "### Install / update"
            echo
            echo "Open SideStore → Sources → refresh, then update Beacon. This is an unsigned IPA;"
            echo "SideStore signs it with your existing Apple ID certificate."
            echo
            echo "Source: ${SOURCE_URL}"
          } > release-notes.md

          if gh release view "$SOURCE_RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            if gh release view "$SOURCE_RELEASE_TAG" --repo "$TARGET_REPO" \
                --json assets -q '.assets[].name' | grep -qx 'apps.json'; then
              # If the old feed exists but cannot be downloaded, fail instead of silently
              # discarding version history.
              gh release download "$SOURCE_RELEASE_TAG" --repo "$TARGET_REPO" \
                --pattern apps.json --dir ota --clobber
            fi
          fi
          cp ios/Beacon/Resources/AppIcon.png ota/Beacon-AppIcon.png

          python3 scripts/ota_source.py \
            --ipa dist/Beacon-unsigned.ipa \
            --version "$APP_VERSION" \
            --build "$APP_BUILD" \
            --source-url "$SOURCE_URL" \
            --download-url "$DOWNLOAD_URL" \
            --icon-url "$ICON_URL" \
            --notes-file release-notes.md \
            --existing ota/apps.json \
            --output ota/apps.json

          # Fail closed if the feed somehow does not point at this exact build.
          python3 - "$APP_VERSION" "$DOWNLOAD_URL" <<'PY'
          import json
          import sys

          version, download = sys.argv[1], sys.argv[2]
          with open("ota/apps.json", encoding="utf-8") as handle:
              feed = json.load(handle)
          app = feed["apps"][0]
          latest = app["versions"][0]
          assert latest["version"] == version, (latest["version"], version)
          assert latest["downloadURL"] == download, (latest["downloadURL"], download)
          assert app["bundleIdentifier"] == "dev.ericserver.beacon"
          assert latest["size"] > 0
          print(f"feed verified: {version}, {latest['size']} bytes, {len(app['versions'])} version(s)")
          PY

      - name: Create immutable versioned GitHub Release
        run: |
          set -euo pipefail
          source ota/urls.env
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/Beacon-unsigned.ipa \
              dist/Beacon-unsigned.ipa.sha256 \
              dist/build-info.txt \
              release-notes.md \
              --clobber --repo "$TARGET_REPO"
            gh release edit "$TAG" --repo "$TARGET_REPO" \
              --title "Beacon ${APP_VERSION}" \
              --notes-file release-notes.md \
              --latest
          else
            TARGET_ARGS=()
            if [ "$TARGET_REPO" = "$GITHUB_REPOSITORY" ]; then
              TARGET_ARGS=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" \
              dist/Beacon-unsigned.ipa \
              dist/Beacon-unsigned.ipa.sha256 \
              dist/build-info.txt \
              release-notes.md \
              --repo "$TARGET_REPO" \
              --title "Beacon ${APP_VERSION}" \
              --notes-file release-notes.md \
              --latest \
              "${TARGET_ARGS[@]}"
          fi

      - name: Publish/update the stable SideStore source feed
        run: |
          set -euo pipefail
          source ota/urls.env
          NOTES="Stable SideStore/AltStore source for Beacon. Do not delete this release; its assets keep fixed URLs used by SideStore."
          if gh release view "$SOURCE_RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release upload "$SOURCE_RELEASE_TAG" \
              ota/apps.json ota/Beacon-AppIcon.png \
              --clobber --repo "$TARGET_REPO"
            gh release edit "$SOURCE_RELEASE_TAG" --repo "$TARGET_REPO" \
              --title "Beacon SideStore source" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create "$SOURCE_RELEASE_TAG" \
              ota/apps.json ota/Beacon-AppIcon.png \
              --repo "$TARGET_REPO" \
              --title "Beacon SideStore source" \
              --notes "$NOTES" \
              --prerelease
          fi

      - name: Fetch the published feed back and verify it
        run: |
          set -euo pipefail
          source ota/urls.env
          # The cache-busting query is only for this verification request; SideStore keeps using
          # the canonical source URL stored in apps.json.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "${SOURCE_URL}?verify=${GITHUB_RUN_ID}-${attempt}" -o downloaded-apps.json; then
              break
            fi
            sleep 5
          done
          python3 - "$APP_VERSION" "$SOURCE_URL" "$DOWNLOAD_URL" <<'PY'
          import json
          import sys

          version, source_url, download_url = sys.argv[1:4]
          with open("downloaded-apps.json", encoding="utf-8") as handle:
              feed = json.load(handle)
          app = feed["apps"][0]
          latest = app["versions"][0]
          assert feed["sourceURL"] == source_url, (feed["sourceURL"], source_url)
          assert app["versions"][0]["version"] == version
          assert latest["downloadURL"] == download_url
          assert latest["size"] > 0
          assert app["bundleIdentifier"] == "dev.ericserver.beacon"
          print(f"published feed verified: {source_url} -> {version}")
          PY

      - name: Fetch the published IPA back and verify its checksum
        run: |
          set -euo pipefail
          source ota/urls.env
          EXPECTED="$(cut -d ' ' -f 1 dist/Beacon-unsigned.ipa.sha256)"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "${DOWNLOAD_URL}?verify=${GITHUB_RUN_ID}-${attempt}" -o downloaded-ipa; then
              break
            fi
            sleep 5
          done
          ACTUAL="$(sha256sum downloaded-ipa | cut -d ' ' -f 1)"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::published IPA checksum mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          test "$(wc -c < downloaded-ipa)" -gt 0
          echo "published IPA verified: $(wc -c < downloaded-ipa) bytes, sha256 $ACTUAL"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### SideStore OTA release"
            echo ""
            echo "- Version: \`${APP_VERSION}\` (build \`${APP_BUILD}\`)"
            echo "- Target repository: \`${TARGET_REPO}\`"
            echo "- Version release: \`${TAG}\`"
            echo "- Status: ${{ job.status }}"
            echo ""
            if [ -f ota/urls.env ]; then
              source ota/urls.env
              echo "SideStore source URL:"
              echo ""
              echo "\`${SOURCE_URL}\`"
              echo ""
              echo "Add it in SideStore → Sources (or open \`sidestore://source?url=${SOURCE_URL}\`)."
              echo "Future updates: open SideStore, refresh Sources, tap Update."
            fi
            echo ""
            echo "The IPA is unsigned and is signed on-device by SideStore. No Apple credentials are stored in this repository."
          } >> "$GITHUB_STEP_SUMMARY"
